<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 340" role="img" aria-label="Ilustración de destape de inodoro">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EAF4F5"/>
      <stop offset="1" stop-color="#D6EAEC"/>
    </linearGradient>
    <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0F6E7A"/>
      <stop offset="1" stop-color="#08363D"/>
    </linearGradient>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#27A6B4"/>
      <stop offset="1" stop-color="#0F6E7A"/>
    </linearGradient>
  </defs>

  <rect width="440" height="340" rx="26" fill="url(#bg)"/>

  <!-- bowl -->
  <path d="M120 150 q100 120 200 0 q-10 70 -100 70 q-90 0 -100 -70 Z" fill="#fff" stroke="#08363D" stroke-width="5"/>
  <ellipse cx="220" cy="150" rx="100" ry="34" fill="#DDE9EA" stroke="#08363D" stroke-width="5"/>
  <ellipse cx="220" cy="150" rx="78" ry="24" fill="url(#water)" opacity="0.85"/>

  <!-- clog / obstruction -->
  <circle cx="220" cy="150" r="16" fill="#FF7A2F"/>
  <path d="M212 142 l16 16 M228 142 l-16 16" stroke="#fff" stroke-width="4" stroke-linecap="round"/>

  <!-- pipe down -->
  <rect x="206" y="220" width="28" height="78" rx="10" fill="url(#pipe)"/>

  <!-- wrench -->
  <g transform="rotate(28 340 120)">
    <rect x="332" y="60" width="16" height="120" rx="8" fill="#FF7A2F"/>
    <path d="M320 60 q16 -22 32 0 q-6 14 -16 14 q-10 0 -16 -14 Z" fill="#FF7A2F"/>
    <path d="M336 50 v-12 h8 v12" stroke="#E8630F" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>

  <!-- droplets -->
  <path d="M150 110 q8 14 0 22 q-8 -8 0 -22 Z" fill="#27A6B4"/>
  <path d="M300 200 q9 16 0 24 q-9 -9 0 -24 Z" fill="#27A6B4" opacity="0.75"/>

  <!-- water waves bottom -->
  <path d="M0 300 q55 -22 110 0 t110 0 t110 0 t110 0 V340 H0 Z" fill="url(#water)" opacity="0.18"/>
</svg>
